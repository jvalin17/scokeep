name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff>=0.8.0

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest (excluding UI tests)
        run: pytest --tb=short -q --ignore=tests/ui

  vitest:
    name: Tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, vitest]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t scokeep:ci-${{ github.sha }} .

      - name: Smoke test — container starts and health endpoint responds
        run: |
          docker run -d --name scokeep-smoke \
            -p 8050:8050 \
            -e SECRET_KEY=ci-test-key-not-real \
            -e ENVIRONMENT=production \
            -e DATABASE_URL=sqlite+aiosqlite:///ci_test.db \
            scokeep:ci-${{ github.sha }}
          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8050/api/health > /dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 30s"
          docker logs scokeep-smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f scokeep-smoke 2>/dev/null || true

  ui:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, vitest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pytest tests/ui/ --tb=short -q --override-ini="asyncio_mode=strict"
        env:
          RATE_LIMIT_ENABLED: "false"
