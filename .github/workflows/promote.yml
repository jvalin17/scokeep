name: Promote to Production

on:
  workflow_dispatch:

jobs:
  # ── Gate: verify CI passed on latest main ─────────────────
  check-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Get latest main SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check CI status on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ steps.sha.outputs.sha }}
          echo "Checking CI status for main @ $SHA"

          # Wait up to 5 minutes for CI to complete (CI takes ~3-4 min)
          echo "Waiting for CI to complete..."
          for i in $(seq 1 30); do
            CONCLUSION=$(gh run list \
              --branch main \
              --workflow ci.yml \
              --limit 1 \
              --json headSha,conclusion,status \
              --jq '.[0] | select(.headSha == "'"$SHA"'") | .conclusion')
            if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "" ]; then
              break
            fi
            echo "  CI still running, waiting 10s... (attempt $i/30)"
            sleep 10
          done

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI has not passed on main ($SHA). Conclusion: ${CONCLUSION:-not found}"
            echo ""
            echo "Latest CI runs:"
            gh run list --workflow ci.yml --branch main --limit 3
            exit 1
          fi

          echo "CI passed on main @ $SHA"

  # ── Promote: point prod at main (no PR) ───────────────────
  promote:
    name: Reset prod to main
    needs: [check-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show pending promote
        run: |
          git fetch origin main prod
          MAIN=$(git rev-parse --short origin/main)
          PROD=$(git rev-parse --short origin/prod)
          echo "main: $MAIN"
          echo "prod: $PROD"
          echo ""

          if [ "$(git rev-parse origin/prod)" = "$(git rev-parse origin/main)" ]; then
            echo "::warning::Nothing to promote — prod already points at main."
            exit 1
          fi

          NEW=$(git rev-list --count origin/prod..origin/main)
          DROP=$(git rev-list --count origin/main..origin/prod)
          echo "=== Commits on main not on prod ($NEW) ==="
          git log --oneline origin/prod..origin/main || true
          echo ""
          echo "=== Commits on prod that will be dropped ($DROP) ==="
          git log --oneline origin/main..origin/prod || true

      - name: Point prod at main
        run: |
          git checkout prod
          git reset --hard origin/main
          git push --force-with-lease=refs/heads/prod:origin/prod origin prod
          echo ""
          echo "Promoted to prod @ $(git rev-parse --short HEAD)."
          echo "Render will auto-deploy."
          echo "Prod smoke workflow runs on push to prod (after ~90s wait)."
