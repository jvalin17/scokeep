services:
  # Production — watches 'prod' branch
  - type: web
    name: scokeep
    runtime: docker
    plan: free
    branch: prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # Stable (staging) — watches 'main' branch
  - type: web
    name: scokeep-stable
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: staging
